name: Deploy advertisement site

on:
  push:
    branches: [master]
  workflow_dispatch:

# allow the "Tests" workflow to run alongside; pages deployment is scoped
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    name: Build site, books and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pinned so the cached browser below always matches the installed
      # playwright version (bump both together when updating)
      - name: Install reader-beware and screenshot tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # playwright version and the browser cache key below must agree:
          # bump `key` when this pin changes so a stale chromium is never
          # restored for a newer playwright build
          python -m pip install "playwright==1.50.0"

      - name: Cache the playwright browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # static key on purpose (paired with the pinned playwright above);
          # bump the trailing number whenever the pin changes so a stale
          # browser is never restored for a newer playwright build
          key: playwright-chromium-1.50-p0
          restore-keys: playwright-chromium-

      - name: Install chromium (playwright)
        run: python -m playwright install --with-deps chromium

      - name: Build example books into site/books/ (epub + html)
        run: python site/scripts/capture_screenshots.py --books-only

      - name: Capture screenshots for the advertisement site
        run: python site/scripts/capture_screenshots.py

      - name: Check every screenshot landed on disk
        run: |
          python - <<'PY'
          import os, sys
          images = "site/images"
          # per-image minimum byte sizes: a blank or broken capture is a
          # few hundred bytes at most, so these floors are generous but
          # well above the blank-page floor.  the device-framed shots use
          # a small viewport (500x860) over a mostly-dark background and
          # compress tiny, hence their lower floor.
          minimums = {
              "cover.png": 10_000,
              "story-entry.png": 20_000,
              "story-state.png": 20_000,
              "story-maze.png": 20_000,
              "story-belair.png": 20_000,
              "device-red-shirt.png": 15_000,
              "device-green-shirt.png": 15_000,
              "editor-index.png": 20_000,
              "editor-studio-preview.png": 40_000,
              "editor-studio-link.png": 40_000,
              "editor-raw.png": 40_000,
          }
          missing = [n for n in minimums if not os.path.exists(os.path.join(images, n))]
          sizes = {n: os.path.getsize(os.path.join(images, n)) for n in minimums}
          tiny = [
              (n, sizes[n])
              for n in minimums
              if n in sizes and sizes[n] < minimums[n]
          ]
          print("captured:", sorted(os.listdir(images)))
          print("sizes:", {n: sizes.get(n) for n in sorted(minimums)})
          if missing or tiny:
              sys.exit(
                  "missing or suspicious screenshots: missing=%s tiny=%s"
                  % (missing, tiny)
              )
          PY

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-site
    name: Publish to github.io
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
