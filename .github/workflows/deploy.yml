name: Deploy advertisement site

on:
  push:
    branches: [master]
  workflow_dispatch:

# allow the "Tests" workflow to run alongside; pages deployment is scoped
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    name: Build site, books and rendered examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # no browser tooling needed: the site's examples are rendered by
      # reader beware itself (html + css only, no playwright/screenshots)
      - name: Install reader-beware
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Render embeds and build example books into site/
        run: python site/scripts/capture_screenshots.py

      - name: Check every rendered embed landed on disk
        run: |
          python - <<'PY'
          import os, sys
          embeds = "site/embeds"
          # minimum byte sizes: a blank or broken render is a few hundred
          # bytes at most; the studio pages carry the whole editor css/js
          # so their floors are higher.
          minimums = {
              "template.css": 1_000,
              "story-entry.html": 500,
              "story-state.html": 500,
              "story-maze.html": 500,
              "story-belair.html": 500,
              "device-red-shirt.html": 1_000,
              "device-green-shirt.html": 1_000,
              "editor-index.html": 3_000,
              "editor-studio-preview.html": 20_000,
              "editor-studio-link.html": 20_000,
              "editor-raw.html": 5_000,
          }
          missing = [n for n in minimums if not os.path.exists(os.path.join(embeds, n))]
          sizes = {n: os.path.getsize(os.path.join(embeds, n)) for n in minimums}
          tiny = [
              (n, sizes[n])
              for n in minimums
              if n in sizes and sizes[n] < minimums[n]
          ]
          print("embedded:", sorted(os.listdir(embeds)))
          print("sizes:", {n: sizes.get(n) for n in sorted(minimums)})
          if missing or tiny:
              sys.exit(
                  "missing or suspicious embeds: missing=%s tiny=%s"
                  % (missing, tiny)
              )
          PY

      - name: Check every story link on the site resolves to a real file
        run: |
          python - <<'PY'
          import os, re, sys, html
          root = "site"
          problems = []

          def unquote(target):
              from urllib.parse import unquote as raw_unquote
              return raw_unquote(target)

          # 1. every relative link in every published book page must point
          # at a file that exists next to it (choice links the demos invite
          # the reader to click: they used to aim inside the .epub package,
          # where no static host can serve them).
          pages = []
          for base, _dirs, files in os.walk(os.path.join(root, "books")):
              for name in files:
                  if name.endswith(".html"):
                      pages.append(os.path.join(base, name))
          for page in pages:
              with open(page, encoding="utf-8") as f:
                  body = f.read()
              for match in re.finditer(r'href="([^"]+)"', body):
                  target = html.unescape(match.group(1))
                  if target.startswith(("http:", "https:", "#", "mailto:")):
                      continue
                  resolved = os.path.normpath(os.path.join(os.path.dirname(page), target))
                  if not os.path.exists(resolved):
                      problems.append("broken link %s -> %s" % (page, target))
          print("checked %d published pages" % len(pages))

          # 2. the story embeds are live demos: every choice link in them
          # must resolve against the site root (srcdoc documents have no
          # base url of their own) to a real published page.  hrefs aim at
          # percent-encoded filenames, so match the written spelling first;
          # on disk the pages are published exactly as encoded.
          for name in ("story-entry", "story-state", "story-maze", "story-belair"):
              path = os.path.join(root, "embeds", name + ".html")
              with open(path, encoding="utf-8") as f:
                  body = f.read()
              hrefs = re.findall(r'href="([^"]+)"', body)
              if not hrefs:
                  problems.append("%s has no links at all" % path)
              for target in hrefs:
                  decoded = html.unescape(target)
                  if decoded.startswith(("http:", "https:", "#", "mailto:")):
                      continue
                  joined = os.path.normpath(os.path.join(root, decoded.lstrip("/")))
                  if not os.path.exists(joined):
                      problems.append("embed link %s -> %s" % (path, target))

          # 3. no iframe srcdoc may hold escaped-up-once markup: after the
          # attribute decodes, nothing inside it may still be entities.
          # The story pages name their targets with literal quote marks
          # (put-on-shirt-{"shirt_color": "red"}.html), so an embed whose
          # href carries &quot; after one decode was escaped twice on the
          # way in -- the browser's parser then sees a bare & character,
          # never matches the quoted target, and no link inside renders
          # (this is how the deployed demos lost their clickable choices).
          with open(os.path.join(root, "index.html"), encoding="utf-8") as f:
              index = f.read()
          for match in re.finditer(r'<iframe class="embed" srcdoc="([^"]*)"', index):
              once = html.unescape(match.group(1))
              if "&quot;" in once or "&lt;" in once:
                  problems.append("srcdoc embed is double-escaped")

          # 4. every relative link written in the index markup itself must
          # exist (the books list links straight into site/books/).
          for match in re.finditer(r'<a[^>]+href="([^"]+)"', index):
              target = html.unescape(match.group(1))
              if target.startswith(("http:", "https:", "#", "mailto:")):
                  continue
              resolved = os.path.normpath(os.path.join(root, target))
              if not os.path.exists(resolved):
                  problems.append("index link -> %s" % target)
          if problems:
              for problem in problems[:40]:
                  print("PROBLEM:", problem)
              sys.exit("%d broken links on the site" % len(problems))
          print("all site links resolve to real files")
          PY

      - name: Check the index embeds every example
        run: |
          python - <<'PY'
          import sys
          with open("site/index.html", encoding="utf-8") as f:
              page = f.read()
          needed = [
              "device red shirt", "device green shirt",
              "story entry", "story state", "story maze", "story belair",
              "editor index", "editor studio preview",
              "editor studio link", "editor raw",
          ]
          missing = []
          for name in needed:
              marker = 'title="reader-beware %s"' % name
              if marker not in page:
                  missing.append(name)
          # no stale screenshot references should survive either
          stale = [w for w in ("images/story-", "images/editor-", "images/device-")
                   if w in page]
          if missing or stale:
              sys.exit("index missing embeds=%s stale refs=%s" % (missing, stale))
          print("index embeds all %d examples" % len(needed))
          PY

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-site
    name: Publish to github.io
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
